---
apiVersion: v1
baseDomain: test.example.com
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  replicas: 0
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  replicas: 1
metadata:
  name: sno-cluster
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 192.168.100.0/24
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
platform:
  baremetal:
    apiVIPs: # Virtual IP address for the Kubernetes API endpoint.
    - 192.168.100.11
    ingressVIPs: # Virtual IP address for ingress (external access to services).
    - 192.168.100.10
    hosts: # List of hosts with their name, role, and boot MAC address.
    - name: master-0
      role: master
      bootMACAddress: 52:54:00:12:34:5a
pullSecret: '<pull_secret>'
sshKey: '<ssh_pub_key>'
